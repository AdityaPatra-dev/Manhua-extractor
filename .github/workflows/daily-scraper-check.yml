name: Daily Scraper Sentinel & Health Check

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Sources to test (comma-separated keys or "all")'
        required: false
        default: 'all'
      query:
        description: 'Search query to test'
        required: false
        default: 'hero'
      concurrency:
        description: 'Concurrency limit'
        required: false
        default: '2'

permissions:
  contents: read
  issues: write

jobs:
  healthcheck:
    name: Scraper Sentinel Runner
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Test Suite (Codecs, Compilers, Slicers, Extractors)
        id: test_suite
        continue-on-error: true
        run: |
          mkdir -p .github/reports
          python3 -m unittest discover -s tests -p "test_*.py" 2>&1 | tee .github/reports/unittest_output.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Manage Test Failure GitHub Issues
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ steps.test_suite.outputs.exit_code }}" -eq 0 ]; then
            python3 .github/scripts/report_test_failure.py --status success --log-file .github/reports/unittest_output.log
          else
            python3 .github/scripts/report_test_failure.py --status failure --log-file .github/reports/unittest_output.log
          fi

      - name: Execute Scraper Health Check
        run: |
          python3 .github/scripts/check_scrapers.py \
            --sources "${{ inputs.sources || 'all' }}" \
            --query "${{ inputs.query || 'hero' }}" \
            --concurrency "${{ inputs.concurrency || '2' }}"

      - name: Process Results & Manage GitHub Issues
        env:
          # Uses user's PAT_TOKEN if configured, otherwise falls back to GITHUB_TOKEN
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPORT_PATH: .github/reports/scraper_health.json
        run: |
          python3 .github/scripts/manage_issues.py

      - name: Upload Health Check Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-health-report
          path: |
            .github/reports/scraper_health.json
            .github/reports/unittest_output.log
          retention-days: 14

