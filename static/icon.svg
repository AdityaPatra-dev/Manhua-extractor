<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="v_bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e0b36" />
      <stop offset="60%" stop-color="#0a0518" />
      <stop offset="100%" stop-color="#030008" />
    </radialGradient>
    <linearGradient id="v_cyan_pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="v_glow_grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="v_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#v_bg)" />
  <rect x="4" y="4" width="504" height="504" rx="113" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3" />

  <!-- Outer Hexagonal Gate Brackets -->
  <polygon points="256,55 425,152 425,348 256,445 87,348 87,152" 
           fill="none" stroke="#4338ca" stroke-width="4" stroke-dasharray="24 16" opacity="0.6" />

  <!-- Concentric Warp Portal Spirals -->
  <!-- Spiral Blade 1 -->
  <path d="M 256,256 C 290,190 380,170 410,210 C 440,250 410,350 350,380 C 290,410 190,380 150,320 C 110,260 140,160 210,120 C 280,80 390,100 420,170" 
        fill="none" stroke="url(#v_cyan_pink)" stroke-width="14" stroke-linecap="round" opacity="0.85" filter="url(#v_glow)" />

  <!-- Spiral Blade 2 (Counter balance) -->
  <path d="M 256,256 C 220,320 130,340 100,300 C 70,260 100,160 160,130 C 220,100 320,130 360,190 C 400,250 370,350 300,390 C 230,430 120,410 90,340" 
        fill="none" stroke="url(#v_glow_grad)" stroke-width="10" stroke-linecap="round" opacity="0.75" />

  <!-- Inward Data Shards (Downloading / Pulling into singularity) -->
  <polygon points="256,120 262,150 256,160 250,150" fill="#22d3ee" filter="url(#v_glow)" />
  <polygon points="380,220 355,235 348,228 368,212" fill="#ec4899" filter="url(#v_glow)" />
  <polygon points="340,350 320,330 325,320 348,335" fill="#a855f7" />
  <polygon points="170,360 190,340 198,348 178,368" fill="#22d3ee" />
  <polygon points="130,220 160,230 162,240 135,232" fill="#818cf8" />

  <!-- Orbital Rings -->
  <circle cx="256" cy="256" r="85" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="12 10" opacity="0.8" />
  <circle cx="256" cy="256" r="50" fill="none" stroke="#ec4899" stroke-width="4" stroke-dasharray="8 6" />

  <!-- Singularity Core -->
  <circle cx="256" cy="256" r="30" fill="#ffffff" filter="url(#v_glow)" />
  <polygon points="256,190 265,245 320,256 265,267 256,322 247,267 192,256 247,245" fill="#ffffff" />
  <circle cx="256" cy="256" r="12" fill="#06b6d4" />
</svg>
